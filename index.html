<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6dccb">
  <title>Baby Shower Invitation</title>
  <link rel="stylesheet" href="template/fonts.css">
  <link rel="stylesheet" href="template/invite.css">
  <style>
    html, body { height: 100%; margin: 0; }
    body { background: #f3e6dc; display: grid; place-items: center; }
    .stage-host { width: 100%; height: 100vh; height: 100dvh; max-width: 520px; position: relative;
      box-shadow: 0 0 80px rgba(120, 80, 60, .25); }
    .picker { position: fixed; inset: 0; display: grid; place-content: center; gap: 12px; text-align: center; font-family: 'Nunito', system-ui, sans-serif; color: #7a5b49; }
    .picker a { color: #e8788d; font-weight: 700; }
  </style>
</head>
<body>
  <div class="stage-host" id="host"></div>

  <!-- Each customer is one file in invites/, loaded on demand from ?invite=<slug>. No edits needed here. -->

  <script src="template/art.js"></script>
  <script src="template/invite.js"></script>
  <script>
    /*
     * ?invite=<slug>   which invitation to load from invites/<slug>.js
     * ?guest=Name      pre-fill the RSVP name
     * ?stage=card      jump straight to the card (open | float | land | card)
     * ?page=0|1|2      start on invitation / details / RSVP
     */
    (function () {
      var q = new URLSearchParams(location.search);
      var slug = q.get('invite') || '';
      var host = document.getElementById('host');

      function message(text) {
        host.innerHTML = '<div class="picker"><p>' + text + '</p></div>';
      }
      // Only plain slugs are loaded, so the query string can never pull in another file.
      if (!/^[a-z0-9][a-z0-9-]{0,63}$/.test(slug)) {
        return message(slug ? 'We couldn\u2019t find that invitation.' : 'Open your invitation link to see it here.');
      }

      var el = document.createElement('script');
      el.src = 'invites/' + slug + '.js';
      el.onerror = function () { message('We couldn\u2019t find that invitation.'); };
      el.onload = function () {
        if (!BabyInvite.get(slug)) return message('We couldn\u2019t find that invitation.');
        var inv = BabyInvite.mount(host, slug, {
          guest: q.get('guest') || '',
          stage: q.get('stage') || undefined,
          page: q.get('page') || 0,
          autoplay: q.get('autoplay') !== '0',
        });
        var c = inv.config;
        document.title = c.pageTitle || (c.headline.replace(/\n/g, ' ') + ' \u00b7 ' + c.honouring);
        document.body.style.background = c.theme.skyMid;
        document.querySelector('meta[name=theme-color]').content = c.theme.skyMid;
        window.invitation = inv;
      };
      document.head.appendChild(el);
    })();
  </script>
</body>
</html>
